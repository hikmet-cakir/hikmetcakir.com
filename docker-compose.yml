services:
  zookeeper:
    image: wurstmeister/zookeeper
    ports:
      - "2181:2181"
    networks:
      - hikmetcakirblog_network

  kafka:
    image: wurstmeister/kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_BROKER_ID: 1
    depends_on:
      - zookeeper  
    networks:
      - hikmetcakirblog_network
       
  configserver:
    image: hikmetcakirdev/configapi:v10
    container_name: configserver
    networks:
      - hikmetcakirblog_network
    ports:
      - "8888:8888"
    restart: always
    environment:      
      - GIT_URI=ENTER_GIT_URI
      - GIT_USERNAME=ENTER_USERNAME
      - GIT_PASSWORD=ENTER_GIT_PASSWORD
      

  coreservice:
    image: hikmetcakirdev/coreapi:v29
    container_name: coreservice
    networks:
      - hikmetcakirblog_network
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - hikmetcakirblog_network

  uireader:
    image: hikmetcakirdev/uireader:v62
    container_name: uireader
    networks:
      - hikmetcakirblog_network
    ports:
      - "4000:4000"
    restart: always
    environment:
      - NODE_ENV=production
    
  uieditor:
    image: hikmetcakirdev/uieditor:v63
    container_name: uieditor
    networks:
      - hikmetcakirblog_network
    ports:
      - "4001:4001"
    restart: always    
    
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - hikmetcakirblog_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - uireader
      - coreservice
    networks:
      - hikmetcakirblog_network
    restart: always

networks:
  hikmetcakirblog_network:
    driver: bridge  
    
volumes:
  mongodb_data:    