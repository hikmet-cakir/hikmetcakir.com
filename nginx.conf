events {
  worker_connections 1024;
}

http {
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  # HTTP → HTTPS yönlendirme
  server {
    listen 80;
    server_name hikmetcakir.com www.hikmetcakir.com;
    return 301 https://$host$request_uri;
  }

  # HTTPS
  server {
    listen 443 ssl;
    server_name hikmetcakir.com www.hikmetcakir.com;

    ssl_certificate     /etc/letsencrypt/live/hikmetcakir.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hikmetcakir.com/privkey.pem;

    location /api/ {
      proxy_pass         http://coreservice:8080/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_connect_timeout 10s;
      proxy_read_timeout    30s;
      proxy_send_timeout    30s;
    }

    location /admin/ {
      proxy_pass         http://uieditor:4001/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
    }

    location / {
      proxy_pass         http://uireader:4000/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
    }
  }
}