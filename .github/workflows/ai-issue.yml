name: AI Issue Handler

on:
  issues:
    types: [opened, assigned]

jobs:
  handle-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Process issue with GitHub Models and create PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO: ${{ github.repository }}
        run: |
          cat << 'EOF' > process_issue.mjs
          import { execSync } from 'child_process';
          import https from 'https';
          import { writeFileSync, mkdirSync, readFileSync } from 'fs';
          import { dirname } from 'path';

          const issueNumber = process.env.ISSUE_NUMBER;
          const issueTitle = process.env.ISSUE_TITLE;
          const issueBody = process.env.ISSUE_BODY || '';
          const githubToken = process.env.GITHUB_TOKEN;
          const repo = process.env.REPO;
          const repoOwner = repo.split('/')[0];
          const branchName = `ai/issue-${issueNumber}`;

          // Git config
          execSync('git config user.name "github-actions[bot]"');
          execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');

          // Get repo file structure
          const fileTree = execSync('find . -type f -not -path "./.git/*" -not -path "./node_modules/*" -not -path "./.github/*" -not -path "./dist/*"').toString().trim();

          // Read relevant file contents
          const relevantFiles = fileTree.split('\n')
            .filter(f => f.match(/\.(astro|js|ts|css|json)$/) && !f.includes('package-lock'))
            .slice(0, 10);

          let fileContents = '';
          for (const filePath of relevantFiles) {
            try {
              const content = readFileSync(filePath, 'utf8');
              fileContents += `\n\n=== ${filePath} ===\n${content.slice(0, 800)}`;
            } catch (e) {}
          }

          const prompt = `You are an AI developer assistant working on a blog website built with Astro.js.

          Repository file structure:
          ${fileTree}

          Key file contents:
          ${fileContents}

          Issue #${issueNumber}: ${issueTitle}
          Issue description: ${issueBody}

          Based on this issue, respond with ONLY a valid JSON object (no markdown, no code blocks, no extra text):
          {
            "summary": "Brief summary of what needs to be done",
            "files": [
              {
                "path": "relative/path/to/file.ext",
                "action": "create or modify or delete",
                "content": "complete file content here",
                "description": "what changed and why"
              }
            ],
            "pr_title": "PR title",
            "pr_body": "Detailed PR description in markdown"
          }

          Rules:
          - Return ONLY the JSON object, no markdown fences, no backticks
          - For modify/create: provide complete file content
          - Keep changes minimal and focused`;

          const requestData = JSON.stringify({
            model: 'gpt-4o',
            messages: [{ role: 'user', content: prompt }],
            temperature: 0.2,
            max_tokens: 8192,
            response_format: { type: 'json_object' }
          });

          // Call GitHub Models API
          const apiResponse = await new Promise((resolve, reject) => {
            const options = {
              hostname: 'models.inference.ai.azure.com',
              path: '/chat/completions',
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${githubToken}`
              }
            };

            const req = https.request(options, (res) => {
              let data = '';
              res.on('data', chunk => data += chunk);
              res.on('end', () => {
                try {
                  resolve(JSON.parse(data));
                } catch(e) {
                  reject(new Error('Failed to parse API response: ' + data));
                }
              });
            });
            req.on('error', reject);
            req.write(requestData);
            req.end();
          });

          console.log('API response status:', apiResponse.choices ? 'OK' : 'ERROR');

          if (!apiResponse.choices || !apiResponse.choices[0]) {
            throw new Error(`API error: ${JSON.stringify(apiResponse)}`);
          }

          const rawText = apiResponse.choices[0].message.content;
          console.log('Raw response:', rawText.slice(0, 500));

          const cleaned = rawText.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim();

          let plan;
          try {
            plan = JSON.parse(cleaned);
          } catch(e) {
            const jsonMatch = cleaned.match(/\{[\s\S]*\}/);
            if (!jsonMatch) throw new Error('No valid JSON in response');
            plan = JSON.parse(jsonMatch[0]);
          }

          console.log('Plan summary:', plan.summary);
          console.log('Files to change:', plan.files.length);

          // Create branch
          execSync(`git checkout -b ${branchName}`);

          // Apply file changes
          for (const file of plan.files) {
            console.log(`${file.action}: ${file.path}`);
            if (file.action === 'delete') {
              execSync(`git rm -f "${file.path}"`);
            } else {
              mkdirSync(dirname(file.path), { recursive: true });
              writeFileSync(file.path, file.content, 'utf8');
              execSync(`git add "${file.path}"`);
            }
          }

          // Check if there are changes to commit
          const status = execSync('git status --porcelain').toString().trim();
          if (!status) {
            console.log('No changes to commit');
            process.exit(0);
          }

          // Commit and push
          execSync(`git commit -m "fix: resolve issue #${issueNumber} - ${issueTitle.slice(0, 50)}"`);
          execSync(`git push origin ${branchName}`);

          // Create PR
          const prData = JSON.stringify({
            title: plan.pr_title,
            body: `${plan.pr_body}\n\n---\n🤖 Auto-generated by AI for issue #${issueNumber}`,
            head: branchName,
            base: 'main'
          });

          const makeRequest = (options, data) => new Promise((resolve, reject) => {
            const req = https.request(options, (res) => {
              let body = '';
              res.on('data', chunk => body += chunk);
              res.on('end', () => resolve(JSON.parse(body)));
            });
            req.on('error', reject);
            if (data) req.write(data);
            req.end();
          });

          const prResponse = await makeRequest({
            hostname: 'api.github.com',
            path: `/repos/${repo}/pulls`,
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${githubToken}`,
              'User-Agent': 'github-actions'
            }
          }, prData);

          if (prResponse.html_url) {
            console.log('PR created:', prResponse.html_url);
          } else {
            console.log('PR response:', JSON.stringify(prResponse));
          }

          // Assign PR to repo owner
          if (prResponse.number) {
            const assignData = JSON.stringify({
              assignees: [repoOwner]
            });

            await makeRequest({
              hostname: 'api.github.com',
              path: `/repos/${repo}/issues/${prResponse.number}/assignees`,
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${githubToken}`,
                'User-Agent': 'github-actions'
              }
            }, assignData);

            console.log('PR assigned to:', repoOwner);
          }
          EOF
          node process_issue.mjs
